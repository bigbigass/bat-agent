server:
  host: 0.0.0.0
  port: 8080

services:
  http:
    enabled: true
  mqtt:
    enabled: false
    broker: "tcp://127.0.0.1:1883"
    clientId: "deploy-agent"
    username: ""
    password: ""
    commandTopic: "deploy-agent/run"
    qos: 1

auth:
  username: admin
  # 至少 8 位；生产环境务必改掉
  password: change-me-please

runner:
  # 单个 bat 最大执行时间（秒）
  timeoutSeconds: 300
  # bat 脚本所在目录；留空 = deploy-agent.exe 所在目录
  scriptDir: ""

preRun:
  download:
    # 执行脚本前的下载工具；留空 = 自动使用 config.yaml 同目录的 tools/download_simple.bat（如存在）
    # 下载脚本不是内置文件；请在部署目录自行提供该脚本及所需工具/凭据
    # 相对路径基于 config.yaml 所在目录解析
    script: ""
    # 下载步骤最大执行时间（秒），只作用于前置下载
    timeoutSeconds: 300

release:
  # 从 HTTPS 清单地址周期性获取可用版本；禁用时不访问清单
  enabled: false
  # enabled=true 时必须填写稳定的 HTTPS manifest 地址；留空则保持功能关闭
  manifestURL: "https://example.invalid/deploy-agent/releases.json"
  # 相对路径基于 config.yaml 所在目录解析
  downloadDir: "tools/download"
  refreshSeconds: 300
